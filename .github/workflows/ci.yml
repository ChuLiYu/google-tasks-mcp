name: CI
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Pin npm
        run: npm install --global npm@11.19.1 --ignore-scripts
      - run: npm ci --ignore-scripts
      - name: Contracts, documentation, unit and integration tests, build
        run: npm run check
      - name: Synthetic stdio and crash recovery
        run: npm run test:synthetic
  launchers:
    # The launchers target macOS and need /bin/zsh, which the Linux job and image lack.
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - name: Shell syntax
        run: |
          for script in containers/*.sh; do sh -n "$script"; done
          for script in scripts/*.zsh; do zsh -n "$script"; done
      - name: Launcher behavior with fake Docker and Tunnel clients
        run: npm run test:launchers
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - name: Compose file is valid
        run: docker compose -f containers/google-compose.yaml config --quiet
      - name: Build the runtime image, which reruns the full check
        run: docker build -f containers/Dockerfile -t google-tasks-mcp:ci .
      - name: Hardened synthetic start and tool discovery
        run: node scripts/check-container.mjs google-tasks-mcp:ci
